name: Build

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Compute short SHA
        id: sha
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image (load, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.sha.outputs.short }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            APP_VERSION=${{ steps.sha.outputs.short }}
          load: true
          push: false

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ steps.sha.outputs.short }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          cache-from: type=gha
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.sha.outputs.short }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            APP_VERSION=${{ steps.sha.outputs.short }}
          push: true
