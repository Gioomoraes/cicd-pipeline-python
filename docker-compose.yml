services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: cicd-pipeline-python:${APP_VERSION:-dev}
    ports:
      - "8000:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
